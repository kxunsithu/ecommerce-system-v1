<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MyShop</title>
    <link href="../output.css" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen py-12 px-4 flex items-center justify-center">

    <!-- Login Container -->
    <div class="w-full max-w-md bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sm:p-10">

        <!-- Header -->
        <div class="text-center mb-8">
            <a href="home.html" class="text-3xl font-bold text-blue-600">
                MyShop
            </a>
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mt-4">
                Welcome Back!
            </h1>
            <p class="text-gray-500 mt-2 text-sm">
                Login to your account to continue shopping.
            </p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm transition duration-200"></div>

        <!-- Login Form -->
        <form id="login-form" novalidate class="space-y-5">

            <!-- Email Address -->
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
                    Email Address
                </label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="example@gmail.com"
                    required
                    autocomplete="email"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-sm text-gray-900"
                >
                <p id="email-error" class="hidden text-xs text-red-500 mt-1"></p>
            </div>

            <!-- Password -->
            <div>
                <div class="flex items-center justify-between mb-1.5">
                    <label for="password" class="block text-sm font-medium text-gray-700">
                        Password
                    </label>
                    <a href="#forgot" id="forgot-link" class="text-xs text-blue-600 hover:underline">
                        Forgot Password?
                    </a>
                </div>

                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        class="w-full pl-4 pr-11 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-sm text-gray-900"
                    >
                    <button
                        type="button"
                        id="toggle-password"
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 cursor-pointer"
                        aria-label="Toggle password visibility"
                    >
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <p id="password-error" class="hidden text-xs text-red-500 mt-1"></p>
            </div>

            <!-- Remember Me -->
            <div class="flex items-center gap-2">
                <input
                    type="checkbox"
                    id="remember"
                    name="remember"
                    checked
                    class="w-4 h-4 accent-blue-600 cursor-pointer"
                >
                <label for="remember" class="text-sm text-gray-600 cursor-pointer">
                    Remember me
                </label>
            </div>

            <!-- Login Button -->
            <button
                id="login-btn"
                type="submit"
                class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-semibold hover:bg-blue-700 active:scale-[0.99] transition shadow-xs hover:shadow-md cursor-pointer flex items-center justify-center gap-2"
            >
                <span id="btn-text">Login</span>
                <span id="btn-spinner" class="hidden inline-block animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
            </button>

        </form>

        <!-- Register Link -->
        <div class="text-center mt-7">
            <p class="text-sm text-gray-500">
                Don't have an account?
                <a href="register.html" class="text-blue-600 font-semibold hover:underline">
                    Create Account
                </a>
            </p>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-5">
            <a href="home.html" class="text-sm text-gray-500 hover:text-blue-600 transition">
                &larr; Back to Home
            </a>
        </div>

    </div>

    <script type="module" src="../js/login.js"></script>

</body>
</html>
