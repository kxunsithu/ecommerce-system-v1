
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - MyShop</title>

    <link href="../output.css" rel="stylesheet">

</head>

<body class="bg-gray-50 min-h-screen">

    <!-- Login Section -->
    <section class="min-h-screen flex items-center justify-center px-4 py-12">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg
                    border border-gray-100 p-6 sm:p-10">

            <!-- Header -->
            <div class="text-center mb-8">

                <a href="index.html"
                   class="text-3xl font-bold text-blue-600">
                    MyShop
                </a>

                <h1 class="text-2xl sm:text-3xl font-bold
                           text-gray-900 mt-5">
                    Welcome Back!
                </h1>

                <p class="text-gray-500 mt-2">
                    Login to your account to continue shopping.
                </p>

            </div>

            <!-- Login Form -->
            <form action="#" method="POST" class="space-y-5">

                <!-- Email -->
                <div>

                    <label for="email"
                           class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                        autocomplete="email"
                        class="w-full px-4 py-3 border border-gray-300
                               rounded-lg outline-none
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500 transition"
                    >

                </div>

                <!-- Password -->
                <div>

                    <div class="flex items-center justify-between mb-2">

                        <label for="password"
                               class="block text-sm font-medium
                                      text-gray-700">
                            Password
                        </label>

                        <a href="forgot-password.html"
                           class="text-sm text-blue-600
                                  hover:underline">
                            Forgot Password?
                        </a>

                    </div>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                        class="w-full px-4 py-3 border border-gray-300
                               rounded-lg outline-none
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500 transition"
                    >

                </div>

                <!-- Remember Me -->
                <div class="flex items-center gap-2">

                    <input
                        type="checkbox"
                        id="remember"
                        name="remember"
                        class="w-4 h-4 accent-blue-600"
                    >

                    <label for="remember"
                           class="text-sm text-gray-600">
                        Remember me
                    </label>

                </div>

                <!-- Login Button -->
                <button
                    type="submit"
                    class="w-full bg-blue-600 text-white py-3
                           rounded-lg font-semibold
                           hover:bg-blue-700 transition">
                    Login
                </button>

            </form>

            <!-- Register Link -->
            <div class="text-center mt-7">

                <p class="text-sm text-gray-500">
                    Don't have an account?

                    <a href="register.html"
                       class="text-blue-600 font-semibold
                              hover:underline">
                        Create Account
                    </a>
                </p>

            </div>

            <!-- Back to Home -->
            <div class="text-center mt-5">

                <a href="home.html"
                   class="text-sm text-gray-500
                          hover:text-blue-600 transition">
                    &larr; Back to Home
                </a>

            </div>

        </div>

    </section>

</body>
</html>
