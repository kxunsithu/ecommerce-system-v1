
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - MyShop</title>
    <link href="../output.css" rel="stylesheet">
    
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- Register Section -->
    <section class="min-h-screen flex items-center justify-center px-4 py-12">

        <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg
                    border border-gray-100 p-6 sm:p-10">

            <!-- Header -->
            <div class="text-center mb-8">

                <a href="index.html"
                   class="text-3xl font-bold text-blue-600">
                    MyShop
                </a>

                <h1 class="text-2xl sm:text-3xl font-bold
                           text-gray-900 mt-5">
                    Create Your Account
                </h1>

                <p class="text-gray-500 mt-2">
                    Join MyShop and start shopping today.
                </p>

            </div>

            <!-- Register Form -->
            <form action="#" method="POST" class="space-y-5">

                <!-- Full Name -->
                <div>
                    <label for="name"
                           class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        name="name"
                        placeholder="Enter your full name"
                        required
                        autocomplete="name"
                        class="w-full px-4 py-3 border border-gray-300
                               rounded-lg outline-none
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500 transition"
                    >
                </div>

                <!-- Email and Phone -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">

                    <div>
                        <label for="email"
                               class="block text-sm font-medium
                                      text-gray-700 mb-2">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="example@gmail.com"
                            required
                            autocomplete="email"
                            class="w-full px-4 py-3 border border-gray-300
                                   rounded-lg outline-none
                                   focus:ring-2 focus:ring-blue-500
                                   focus:border-blue-500 transition"
                        >
                    </div>

                    <div>
                        <label for="phone"
                               class="block text-sm font-medium
                                      text-gray-700 mb-2">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            name="phone"
                            placeholder="09xxxxxxxxx"
                            required
                            autocomplete="tel"
                            class="w-full px-4 py-3 border border-gray-300
                                   rounded-lg outline-none
                                   focus:ring-2 focus:ring-blue-500
                                   focus:border-blue-500 transition"
                        >
                    </div>

                </div>

                <!-- Gender -->
                <div>
                    <label for="gender"
                           class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        Gender
                    </label>

                    <select
                        id="gender"
                        name="gender"
                        required
                        class="w-full px-4 py-3 border border-gray-300
                               rounded-lg bg-white outline-none
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500 transition">

                        <option value="" disabled selected>
                            Select your gender
                        </option>

                        <option value="male">Male</option>
                        <option value="female">Female</option>
                        <option value="other">Other</option>

                    </select>
                </div>

                <!-- Password -->
                <div>
                    <label for="password"
                           class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                        class="w-full px-4 py-3 border border-gray-300
                               rounded-lg outline-none
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500 transition"
                    >

                    <p class="text-xs text-gray-400 mt-2">
                        Password must be at least 8 characters.
                    </p>
                </div>

                <!-- Confirm Password -->
                <div>
                    <label for="confirm_password"
                           class="block text-sm font-medium
                                  text-gray-700 mb-2">
                        Confirm Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Confirm your password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                        class="w-full px-4 py-3 border border-gray-300
                               rounded-lg outline-none
                               focus:ring-2 focus:ring-blue-500
                               focus:border-blue-500 transition"
                    >
                </div>

                <!-- Terms & Conditions -->
                <div class="flex items-start gap-3">

                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                        class="w-4 h-4 mt-1 accent-blue-600"
                    >

                    <label for="terms"
                           class="text-sm text-gray-600">
                        I agree to the
                        <a href="#terms"
                           class="text-blue-600 hover:underline">
                            Terms & Conditions
                        </a>
                        and
                        <a href="#privacy"
                           class="text-blue-600 hover:underline">
                            Privacy Policy
                        </a>.
                    </label>

                </div>

                <!-- Register Button -->
                <button
                    id="create-btn"
                    type="button"
                    class="w-full bg-blue-600 text-white py-3
                           rounded-lg font-semibold
                           hover:bg-blue-700 transition">
                    Create Account
                </button>

            </form>

            <!-- Login Link -->
            <div class="text-center mt-7">

                <p class="text-sm text-gray-500">
                    Already have an account?

                    <a href="login.html"
                       class="text-blue-600 font-semibold
                              hover:underline">
                        Login
                    </a>
                </p>

            </div>

             <!-- Back to Home -->
            <div class="text-center mt-5">

                <a href="home.html"
                   class="text-sm text-gray-500
                          hover:text-blue-600 transition">
                    &larr; Back to Home
                </a>

            </div>


        </div>

    </section>

    <script src="../js/register.js"></script>

</body>
</html>
