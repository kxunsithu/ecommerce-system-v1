<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register - MyShop</title>
    <link href="../output.css" rel="stylesheet">
</head>

<body class="bg-gray-50 min-h-screen py-12 px-4 flex items-center justify-center">

    <!-- Register Container -->
    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-lg border border-gray-100 p-6 sm:p-10">

        <!-- Header -->
        <div class="text-center mb-8">
            <a href="home.html" class="text-3xl font-bold text-blue-600">
                MyShop
            </a>
            <h1 class="text-2xl sm:text-3xl font-bold text-gray-900 mt-4">
                Create Your Account
            </h1>
            <p class="text-gray-500 mt-2 text-sm">
                Join MyShop and start shopping with exclusive deals.
            </p>
        </div>

        <!-- Alert Notification Box -->
        <div id="alert-box" class="hidden mb-6 p-4 rounded-xl text-sm transition duration-200"></div>

        <!-- Register Form -->
        <form id="register-form" novalidate class="space-y-5">

            <!-- Full Name -->
            <div>
                <label for="name" class="block text-sm font-medium text-gray-700 mb-1.5">
                    Full Name <span class="text-red-500">*</span>
                </label>
                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="John Doe"
                    required
                    autocomplete="name"
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-sm text-gray-900"
                >
                <p id="name-error" class="hidden text-xs text-red-500 mt-1"></p>
            </div>

            <!-- Email and Phone -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Email Address <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="example@gmail.com"
                        required
                        autocomplete="email"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-sm text-gray-900"
                    >
                    <p id="email-error" class="hidden text-xs text-red-500 mt-1"></p>
                </div>

                <div>
                    <label for="phone" class="block text-sm font-medium text-gray-700 mb-1.5">
                        Phone Number <span class="text-red-500">*</span>
                    </label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="09123456789"
                        required
                        autocomplete="tel"
                        class="w-full px-4 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-sm text-gray-900"
                    >
                    <p id="phone-error" class="hidden text-xs text-red-500 mt-1"></p>
                </div>
            </div>

            <!-- Gender -->
            <div>
                <label for="gender" class="block text-sm font-medium text-gray-700 mb-1.5">
                    Gender <span class="text-red-500">*</span>
                </label>
                <select
                    id="gender"
                    name="gender"
                    required
                    class="w-full px-4 py-3 border border-gray-300 rounded-xl bg-white outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-sm text-gray-900 cursor-pointer"
                >
                    <option value="" disabled selected>Select your gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <p id="gender-error" class="hidden text-xs text-red-500 mt-1"></p>
            </div>

            <!-- Password -->
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1.5">
                    Password <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="At least 8 characters"
                        minlength="8"
                        required
                        autocomplete="new-password"
                        class="w-full pl-4 pr-11 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-sm text-gray-900"
                    >
                    <button
                        type="button"
                        id="toggle-password"
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 cursor-pointer"
                        aria-label="Toggle password visibility"
                    >
                        <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <p id="password-error" class="hidden text-xs text-red-500 mt-1"></p>
            </div>

            <!-- Confirm Password -->
            <div>
                <label for="confirm_password" class="block text-sm font-medium text-gray-700 mb-1.5">
                    Confirm Password <span class="text-red-500">*</span>
                </label>
                <div class="relative">
                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        minlength="8"
                        required
                        autocomplete="new-password"
                        class="w-full pl-4 pr-11 py-3 border border-gray-300 rounded-xl outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition text-sm text-gray-900"
                    >
                    <button
                        type="button"
                        id="toggle-confirm-password"
                        class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-gray-400 hover:text-gray-600 cursor-pointer"
                        aria-label="Toggle confirm password visibility"
                    >
                        <svg class="w-5 h-5 eye-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"/>
                        </svg>
                    </button>
                </div>
                <p id="confirm-password-error" class="hidden text-xs text-red-500 mt-1"></p>
            </div>

            <!-- Terms & Conditions -->
            <div>
                <div class="flex items-start gap-3">
                    <input
                        type="checkbox"
                        id="terms"
                        name="terms"
                        required
                        class="w-4 h-4 mt-1 accent-blue-600 cursor-pointer"
                    >
                    <label for="terms" class="text-sm text-gray-600 cursor-pointer">
                        I agree to the
                        <a href="#terms" class="text-blue-600 hover:underline">Terms & Conditions</a>
                        and
                        <a href="#privacy" class="text-blue-600 hover:underline">Privacy Policy</a>.
                    </label>
                </div>
                <p id="terms-error" class="hidden text-xs text-red-500 mt-1"></p>
            </div>

            <!-- Register Button -->
            <button
                id="create-btn"
                type="submit"
                class="w-full bg-blue-600 text-white py-3.5 rounded-xl font-semibold hover:bg-blue-700 active:scale-[0.99] transition shadow-xs hover:shadow-md cursor-pointer flex items-center justify-center gap-2"
            >
                <span id="btn-text">Create Account</span>
                <span id="btn-spinner" class="hidden inline-block animate-spin rounded-full h-4 w-4 border-2 border-white border-t-transparent"></span>
            </button>

        </form>

        <!-- Login Link -->
        <div class="text-center mt-7">
            <p class="text-sm text-gray-500">
                Already have an account?
                <a href="login.html" class="text-blue-600 font-semibold hover:underline">
                    Login here
                </a>
            </p>
        </div>

        <!-- Back to Home -->
        <div class="text-center mt-5">
            <a href="home.html" class="text-sm text-gray-500 hover:text-blue-600 transition">
                &larr; Back to Home
            </a>
        </div>

    </div>

    <script type="module" src="../js/register.js"></script>

</body>
</html>
